name: Expo 57 Lockfile Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expo-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Regenerate lockfile from package.json
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Validate clean install
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --ignore-scripts

      - name: Validate Expo dependency alignment
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: TypeScript check
        run: npm run typecheck

      - name: Android prebuild validation
        run: npx expo prebuild --platform android --clean --no-install

      - name: Commit repaired lockfile
        run: |
          set -euo pipefail
          git diff --check -- package-lock.json
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already valid; nothing to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Repair Expo 57 package lockfile"
          git push origin HEAD:main
