name: Expo 57 Upgrade Candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expo-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Prepare report directory
        run: mkdir -p upgrade-report/candidate

      - name: Build Expo 57 candidate
        shell: bash
        env:
          npm_config_ignore_scripts: 'true'
          npm_config_legacy_peer_deps: 'true'
        run: |
          set +e

          echo "Node: $(node --version)" | tee upgrade-report/upgrade-status.txt
          echo "npm: $(npm --version)" | tee -a upgrade-report/upgrade-status.txt
          echo "Base commit: $GITHUB_SHA" | tee -a upgrade-report/upgrade-status.txt
          echo >> upgrade-report/upgrade-status.txt

          node <<'NODE'
          const fs = require('fs')
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'))
          delete app.expo.splash
          app.expo.plugins = (app.expo.plugins || []).filter((plugin) => {
            const name = Array.isArray(plugin) ? plugin[0] : plugin
            return name !== 'expo-splash-screen'
          })
          app.expo.plugins.push([
            'expo-splash-screen',
            { backgroundColor: '#fafaf9' }
          ])
          app.expo.plugins = app.expo.plugins.map((plugin) => {
            if (!Array.isArray(plugin) || plugin[0] !== 'expo-build-properties') return plugin
            const config = plugin[1] || {}
            config.android = {
              ...(config.android || {}),
              compileSdkVersion: 36,
              targetSdkVersion: 36,
              buildToolsVersion: '36.0.0'
            }
            return [plugin[0], config]
          })
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n')
          NODE

          npm pkg delete scripts.postinstall
          npm uninstall patch-package --ignore-scripts --legacy-peer-deps \
            > upgrade-report/00-remove-legacy-patch-package.log 2>&1
          rm -f patches/expo-modules-core+1.12.26.patch

          npm install expo@57.0.18 --save --ignore-scripts --legacy-peer-deps \
            > upgrade-report/01-install-expo-57.log 2>&1
          INSTALL_EXPO=$?
          echo "install_expo_57=$INSTALL_EXPO" | tee -a upgrade-report/upgrade-status.txt

          npx expo install --fix \
            > upgrade-report/02-expo-install-fix.log 2>&1
          INSTALL_FIX=$?
          echo "expo_install_fix=$INSTALL_FIX" | tee -a upgrade-report/upgrade-status.txt

          npx expo install --check \
            > upgrade-report/03-expo-install-check.log 2>&1
          INSTALL_CHECK=$?
          echo "expo_install_check=$INSTALL_CHECK" | tee -a upgrade-report/upgrade-status.txt

          npx expo-doctor@latest \
            > upgrade-report/04-expo-doctor.log 2>&1
          DOCTOR=$?
          echo "expo_doctor=$DOCTOR" | tee -a upgrade-report/upgrade-status.txt

          npm run typecheck \
            > upgrade-report/05-typecheck.log 2>&1
          TYPECHECK=$?
          echo "typecheck=$TYPECHECK" | tee -a upgrade-report/upgrade-status.txt

          npx expo prebuild --platform android --clean --no-install \
            > upgrade-report/06-prebuild-android.log 2>&1
          PREBUILD=$?
          echo "prebuild_android=$PREBUILD" | tee -a upgrade-report/upgrade-status.txt

          git status --short > upgrade-report/git-status.txt
          git diff -- package.json package-lock.json app.json patches/ > upgrade-report/upgrade.patch
          git diff --stat > upgrade-report/diff-stat.txt

          for file in package.json package-lock.json app.json; do
            if [ -f "$file" ] && ! git diff --quiet -- "$file"; then
              mkdir -p "upgrade-report/candidate/$(dirname "$file")"
              cp "$file" "upgrade-report/candidate/$file"
            fi
          done

          if [ ! -f patches/expo-modules-core+1.12.26.patch ]; then
            echo 'patches/expo-modules-core+1.12.26.patch' > upgrade-report/candidate/deleted-files.txt
          fi

          echo >> upgrade-report/upgrade-status.txt
          echo "Expo 57 candidate generation completed. Non-zero checks are preserved for review." | tee -a upgrade-report/upgrade-status.txt
          exit 0

      - name: Show candidate summary
        if: always()
        run: |
          cat upgrade-report/upgrade-status.txt || true
          echo '--- git status ---'
          cat upgrade-report/git-status.txt || true
          echo '--- diff stat ---'
          cat upgrade-report/diff-stat.txt || true

      - name: Upload Expo 57 candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-57-upgrade-candidate-${{ github.run_number }}
          path: upgrade-report/
          if-no-files-found: error
          retention-days: 14
